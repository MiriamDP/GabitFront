<div class="habit-icon">
  <lucide-icon [name]="habit.category?.icon || 'Circle'" size="32" class="category-icon"></lucide-icon>
</div>
<div class="habit-info">
  <h1 class="habit-name">{{ habit.name }}</h1>
  <p class="habit-description">{{ habit.description }}</p>
  <span class="habit-category" *ngIf="habit.category">
    {{ habit.category.name }}
  </span>

</div>
