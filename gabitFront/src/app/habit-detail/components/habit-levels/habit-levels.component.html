<div class="levels-container">
  <div class="level-card" 
       *ngFor="let level of levels"
       [class.locked]="!isLevelUnlocked(level)"
       [class.active]="isCurrentLevel(level)"
       [class.completed]="level.completed"
       (click)="onLevelClick(level)">
    
    <div class="level-header">
      <label for="nivel">Nivel </label>
      <span class="number-text">{{ level.levelNumber }}</span>
      <lucide-icon [name]="getLevelStatusIcon(level)" size="8" class="status-icon"></lucide-icon>
    </div>

    <div class="level-info">
      <h3 class="level-name">{{ level.name || 'Nivel ' + level.levelNumber }}</h3>
      
      <div class="level-points">
        <span class="points-text">Progreso</span>
        <span class="percentage">{{ getLevelProgress(level) | number:'1.0-0' }}%</span>
      </div>

      <div class="progress-bar">
        <div class="fill" [style.width.%]="getLevelProgress(level)"></div>
      </div>
    </div>
  </div>
</div>
