<div class="modal-overlay" (click)="cancelled.emit()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <div class="modal-actions">
      <button class="btn-cancel" (click)="cancelled.emit()">{{ cancelText }}</button>
      <button class="btn-confirm" (click)="confirmed.emit()">{{ confirmText }}</button>
    </div>
  </div>
</div>
